name: Daily Terraform Progress

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Promote next Terraform project
        shell: bash
        run: |
          set -e

          echo "Looking for the next project..."

          if [ ! -d "queue" ]; then
            echo "queue/ does not exist."
            exit 0
          fi

          NEXT_DIR=$(find queue \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' |
            sort |
            head -n 1)

          if [ -z "$NEXT_DIR" ]; then
            echo "No projects remain in queue."
            rmdir queue
            exit 0
          fi

          echo "Next project: $NEXT_DIR"

          DAY=$(echo "$NEXT_DIR" | sed 's/day-//')

          echo "Day: $DAY"

          mkdir -p src

          echo "Moving $NEXT_DIR from queue/ to src/..."

          mv "queue/$NEXT_DIR" "src/$NEXT_DIR"

          echo "Updating README..."

          sed -i \
            "s/| $DAY |/| $DAY |/; s/| $DAY |\([^|]*\)|\([^|]*\)| ⏳ |/| $DAY |\1|\2| ✅ |/" \
            README.md

          if [ "$DAY" = "100" ]; then
            echo "Day 100 completed. Removing queue/..."
            rmdir queue
          fi

          echo "Promotion completed successfully."

      - name: Show changes
        run: |
          git status
          git diff -- README.md

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "abhinav14mishra"
          git config user.email "abhinav14mishra@gmail.com"

          git add README.md src queue 2>/dev/null || git add README.md src

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "chore: promote next Terraform project"

      - name: Push changes
        run: |
          git push
